<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion Judge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .code-font { font-family: 'Fira Code', 'Consolas', monospace; }
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- 상단 네비게이션 헤더 -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="goToDaysList()">
                <span class="text-2xl">🦁</span>
                <span class="text-base font-bold text-white tracking-wide">Lion Judge</span>
            </div>

            <!-- 네비게이션 탭 -->
            <nav class="flex items-center space-x-1">
                <button onclick="goToDaysList()" id="navDaysBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-days"></i> 실습 일차
                </button>
                <button onclick="showView('status')" id="navStatusBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-line"></i> 제출 현황
                </button>
            </nav>
        </div>

        <!-- 우측 상태 및 계정 -->
        <div class="flex items-center space-x-3">
            <div id="serverStatusBadge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-md text-xs bg-slate-900 border border-slate-800" title="채점 서버 연결 상태">
                <span class="w-2 h-2 rounded-full bg-rose-500" id="statusDot"></span>
                <span id="statusText" class="text-slate-400 text-[11px]">오프라인</span>
            </div>

            <button onclick="openServerModal()" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-2 py-1.5 rounded-lg border border-slate-700 transition" title="서버 설정">
                <i class="fa-solid fa-gear"></i>
            </button>

            <!-- 로그인/사용자 프로필 버튼 -->
            <div id="authContainer">
                <button onclick="openLoginModal()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-to-bracket"></i> 로그인
                </button>
            </div>
        </div>
    </header>

    <!-- ======================================================== -->
    <!-- VIEW 1: 일차 선택 그리드 화면 (Home) -->
    <!-- ======================================================== -->
    <div id="viewDays" class="flex-1 overflow-y-auto p-6 max-w-6xl mx-auto w-full space-y-6">
        <!-- 과목 필터 탭 -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center space-x-2">
                <button onclick="filterDaysSubject('all')" class="day-filter-btn active bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition" data-sub="all">전체 (1~16일차)</button>
                <button onclick="filterDaysSubject('Java')" class="day-filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 font-medium px-3 py-1.5 rounded-lg text-xs transition" data-sub="Java">Java (1~7일차)</button>
                <button onclick="filterDaysSubject('MySQL')" class="day-filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 font-medium px-3 py-1.5 rounded-lg text-xs transition" data-sub="MySQL">MySQL (8~12일차)</button>
                <button onclick="filterDaysSubject('Web')" class="day-filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 font-medium px-3 py-1.5 rounded-lg text-xs transition" data-sub="Web">Web (13~16일차)</button>
            </div>
            <div id="adminNotice" class="hidden text-xs text-amber-400 font-semibold flex items-center gap-1.5">
                <i class="fa-solid fa-user-shield"></i> 관리자 모드: 각 일차별 스위치를 눌러 학생 공개 여부를 제어하세요.
            </div>
        </div>

        <!-- 일차 카드 그리드 -->
        <div id="daysGridContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- 자바스크립트로 16개 일차 카드 렌더링 -->
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- VIEW 2: 선택된 일차의 문제 풀이 화면 (문제 본문 + 에디터) -->
    <!-- ======================================================== -->
    <div id="viewProblem" class="hidden flex-1 flex flex-col overflow-hidden">
        <!-- 상단 일차 헤더 및 난이도(상/중/하) 선택 바 -->
        <div class="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button onclick="goToDaysList()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> 일차 목록
                </button>
                <div class="flex items-center space-x-2">
                    <span id="currentDayBadge" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold px-2.5 py-1 rounded-md">
                        1일차 (Java)
                    </span>
                </div>
            </div>

            <!-- 난이도: 상 / 중 / 하 버튼 -->
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400 mr-1">난이도 선택:</span>
                <button onclick="selectDifficulty('하')" id="diffBtnHa" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span> [하] 초급
                </button>
                <button onclick="selectDifficulty('중')" id="diffBtnJung" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span> [중] 중급
                </button>
                <button onclick="selectDifficulty('상')" id="diffBtnSang" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-rose-400"></span> [상] 심화
                </button>
            </div>
        </div>

        <!-- 2단 분할: 좌측 문제 본문 vs 우측 코드 에디터 -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <!-- 좌측 문제 본문 -->
            <div class="w-full md:w-1/2 flex flex-col border-r border-slate-800 bg-slate-900/40 overflow-y-auto p-6 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span id="pSubjectBadge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">Java</span>
                        <span id="pDayBadge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">1일차</span>
                        <span id="pDiffBadge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">하</span>
                    </div>
                </div>

                <h2 id="pTitle" class="text-lg font-bold text-white tracking-tight"></h2>

                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <p id="pDesc" class="text-xs text-slate-200 leading-relaxed whitespace-pre-line select-text"></p>
                </div>

                <!-- 모범 정답 아코디언 -->
                <div class="border border-slate-800 rounded-xl overflow-hidden bg-slate-900/50">
                    <button onclick="toggleSolution()" class="w-full px-4 py-2.5 text-left text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center justify-between transition">
                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-key text-amber-400"></i> 정답 예시 코드
                        </span>
                        <i id="solChevron" class="fa-solid fa-chevron-down text-slate-500 text-xs transition-transform"></i>
                    </button>
                    <div id="solutionContainer" class="hidden p-4 bg-slate-950 border-t border-slate-800">
                        <pre><code id="pSolutionCode" class="code-font text-xs text-amber-300/90 whitespace-pre-wrap select-text"></code></pre>
                    </div>
                </div>
            </div>

            <!-- 우측 에디터 및 채점 콘솔 -->
            <div class="w-full md:w-1/2 flex flex-col bg-slate-950">
                <div class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between">
                    <span class="text-xs font-medium text-slate-300" id="editorLang">Editor</span>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="resetCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition">초기화</button>
                        <button onclick="copyCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition">복사</button>
                        <button onclick="submitCode()" id="submitBtn" class="text-xs bg-amber-500 hover:bg-amber-400 font-bold text-slate-950 px-3.5 py-1 rounded transition flex items-center gap-1">
                            <i class="fa-solid fa-play"></i> 제출 및 채점
                        </button>
                    </div>
                </div>

                <div class="flex-1 relative">
                    <textarea id="codeEditor" spellcheck="false" class="w-full h-full p-4 bg-slate-950 text-slate-100 code-font text-xs leading-relaxed resize-none focus:outline-none placeholder-slate-700 select-text"></textarea>
                </div>

                <!-- 채점 콘솔 창 -->
                <div class="border-t border-slate-800 bg-slate-900/90 flex flex-col h-52">
                    <div class="px-4 py-1.5 border-b border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-terminal"></i> 실행 결과
                        </span>
                        <span id="judgeDuration">-</span>
                    </div>
                    <div class="p-3.5 flex-1 overflow-y-auto space-y-1.5" id="consoleOutput">
                        <div id="judgeBadge" class="hidden inline-block px-2.5 py-0.5 rounded text-[11px] font-bold"></div>
                        <pre id="consoleText" class="code-font text-xs text-slate-400 whitespace-pre-wrap select-text">// Output console</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- VIEW 3: 백준 스타일 실시간 제출 현황 (Status View) -->
    <!-- ======================================================== -->
    <div id="viewStatus" class="hidden flex-1 overflow-y-auto p-6 max-w-6xl mx-auto w-full space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-list-ol text-amber-400"></i> 과제 제출 현황
            </h2>
            <button onclick="loadSubmissions()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate"></i> 새로고침
            </button>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-900 text-slate-400 uppercase font-semibold border-b border-slate-800">
                    <tr>
                        <th class="px-4 py-2.5">제출#</th>
                        <th class="px-4 py-2.5">학생</th>
                        <th class="px-4 py-2.5">문제</th>
                        <th class="px-4 py-2.5">결과</th>
                        <th class="px-4 py-2.5">점수</th>
                        <th class="px-4 py-2.5">시간</th>
                        <th class="px-4 py-2.5">제출일시</th>
                        <th class="px-4 py-2.5 text-center">코드</th>
                    </tr>
                </thead>
                <tbody id="submissionTableBody" class="divide-y divide-slate-800/80 font-medium">
                </tbody>
            </table>
        </div>
    </div>

    <!-- 소스코드 확인 팝업 모달 -->
    <div id="codeModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-slate-800 px-6 py-3.5 border-b border-slate-700 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-bold text-white" id="modalTitle">제출 소스코드</h3>
                    <p class="text-[11px] text-slate-400" id="modalSubtitle"></p>
                </div>
                <button onclick="closeCodeModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <div class="p-6 flex-1 overflow-y-auto space-y-4">
                <pre class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-amber-200 code-font text-xs overflow-x-auto select-text"><code id="modalCode"></code></pre>
                <div id="modalOutputSection">
                    <span class="text-[11px] text-slate-400 block mb-1">실행 출력:</span>
                    <pre class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-slate-300 code-font text-xs overflow-x-auto select-text"><code id="modalOutput"></code></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-6 shadow-2xl space-y-4">
            <div class="text-center">
                <span class="text-2xl">🦁</span>
                <h3 class="text-base font-bold text-white mt-1">로그인</h3>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">아이디</label>
                    <input type="text" id="loginUsername" required placeholder="admin 또는 student01" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">비밀번호</label>
                    <input type="password" id="loginPassword" required placeholder="비밀번호" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button type="button" onclick="closeLoginModal()" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg">취소</button>
                    <button type="submit" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-1.5 rounded-lg">로그인</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 서버 설정 모달 -->
    <div id="serverModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-server text-amber-400"></i> 채점 서버 설정
            </h3>
            <div>
                <input type="text" id="judgeServerUrlInput" value="http://100.104.124.97:8000" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex items-center justify-between pt-2">
                <button onclick="pingServer()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">연결 테스트</button>
                <div class="space-x-1.5">
                    <button onclick="closeServerModal()" class="text-xs bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg">취소</button>
                    <button onclick="saveServerUrl()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-1.5 rounded-lg">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 문제 데이터셋 -->
    <script src="problems.js"></script>

    <script>
        let selectedDay = 1;
        let selectedDiff = '하';
        let currentProblem = null;
        let filterSubjectMode = 'all';

        let judgeServerUrl = localStorage.getItem('judge_server_url') || 'http://100.104.124.97:8000';
        let currentUser = JSON.parse(localStorage.getItem('current_user') || 'null');

        // 오픈(Unlock) 상태 (기본 1일차만 오픈)
        let unlockedDays = JSON.parse(localStorage.getItem('unlocked_days') || '[1]');

        window.addEventListener('DOMContentLoaded', async () => {
            updateAuthUI();
            checkServerPing();
            await fetchLocks();
            renderDaysGrid();
        });

        // 서버에서 최신 오픈 상태 가져오기
        async function fetchLocks() {
            try {
                const res = await fetch(`${judgeServerUrl}/api/locks`);
                if (res.ok) {
                    const data = await res.json();
                    unlockedDays = data.unlocked_days || [1];
                    localStorage.setItem('unlocked_days', JSON.stringify(unlockedDays));
                }
            } catch (e) {}
        }

        function isDayUnlocked(day) {
            if (currentUser && currentUser.role === 'admin') return true;
            return unlockedDays.includes(day);
        }

        // 일차 목록 뷰로 이동
        function goToDaysList() {
            showView('days');
            renderDaysGrid();
        }

        function showView(viewName) {
            const vDays = document.getElementById('viewDays');
            const vProb = document.getElementById('viewProblem');
            const vStat = document.getElementById('viewStatus');
            const nDays = document.getElementById('navDaysBtn');
            const nStat = document.getElementById('navStatusBtn');

            vDays.classList.add('hidden');
            vProb.classList.add('hidden');
            vStat.classList.add('hidden');

            nDays.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5';
            nStat.className = 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5';

            if (viewName === 'days') {
                vDays.classList.remove('hidden');
                nDays.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 transition flex items-center gap-1.5';
            } else if (viewName === 'problem') {
                vProb.classList.remove('hidden');
                nDays.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 transition flex items-center gap-1.5';
            } else if (viewName === 'status') {
                vStat.classList.remove('hidden');
                nStat.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 transition flex items-center gap-1.5';
                loadSubmissions();
            }
        }

        // 과목 필터
        function filterDaysSubject(sub) {
            filterSubjectMode = sub;
            document.querySelectorAll('.day-filter-btn').forEach(b => {
                b.className = b.dataset.sub === sub 
                    ? 'day-filter-btn active bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition'
                    : 'day-filter-btn bg-slate-900 hover:bg-slate-800 text-slate-300 font-medium px-3 py-1.5 rounded-lg text-xs transition';
            });
            renderDaysGrid();
        }

        // 16개 일차 카드 렌더링
        function renderDaysGrid() {
            const container = document.getElementById('daysGridContainer');
            container.innerHTML = '';

            const isAdmin = currentUser && currentUser.role === 'admin';
            const adminNotice = document.getElementById('adminNotice');
            if (isAdmin) adminNotice.classList.remove('hidden');
            else adminNotice.classList.add('hidden');

            for (let d = 1; d <= 16; d++) {
                const sub = d <= 7 ? 'Java' : (d <= 12 ? 'MySQL' : 'Web');
                if (filterSubjectMode !== 'all' && sub !== filterSubjectMode) continue;

                const isUnlocked = isDayUnlocked(d);
                const isServerUnlocked = unlockedDays.includes(d);

                const card = document.createElement('div');
                card.className = `relative rounded-2xl border p-5 transition flex flex-col justify-between ${
                    isUnlocked 
                        ? 'bg-slate-900/90 border-slate-800 hover:border-amber-500/50 hover:bg-slate-850 cursor-pointer shadow-md'
                        : 'bg-slate-950/60 border-slate-800/40 opacity-50 cursor-not-allowed'
                }`;

                // 상단 헤더: 일차 번호 & 관리자 스위치
                let adminToggleHtml = '';
                if (isAdmin) {
                    adminToggleHtml = `
                        <div class="flex items-center space-x-1.5" onclick="event.stopPropagation()">
                            <span class="text-[10px] ${isServerUnlocked ? 'text-amber-400 font-bold' : 'text-slate-500'}">
                                ${isServerUnlocked ? '오픈됨' : '비공개'}
                            </span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" onchange="toggleDayLock(${d}, this.checked)" class="sr-only peer" ${isServerUnlocked ? 'checked' : ''}>
                                <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-amber-500"></div>
                            </label>
                        </div>
                    `;
                }

                let statusBadge = '';
                if (isUnlocked) {
                    statusBadge = `<span class="inline-flex items-center gap-1 text-[11px] text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20"><i class="fa-solid fa-lock-open text-[9px]"></i> 3문제 오픈</span>`;
                } else {
                    statusBadge = `<span class="inline-flex items-center gap-1 text-[11px] text-slate-500 font-medium bg-slate-800/40 px-2 py-0.5 rounded border border-slate-800"><i class="fa-solid fa-lock text-[9px]"></i> 비공개 (준비 중)</span>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold px-2 py-0.5 rounded ${
                                sub === 'Java' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' :
                                sub === 'MySQL' ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30' :
                                'bg-purple-500/20 text-purple-400 border border-purple-500/30'
                            }">${sub}</span>
                            ${adminToggleHtml}
                        </div>

                        <h3 class="text-base font-bold text-white mb-1">${d}일차 실습</h3>
                        <p class="text-xs text-slate-400 mb-4">
                            ${isUnlocked ? '상 · 중 · 하 3문제 풀이 및 채점' : '실습 시작 시 공개됩니다.'}
                        </p>
                    </div>

                    <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between">
                        ${statusBadge}
                        ${isUnlocked ? '<span class="text-xs text-amber-400 font-semibold group-hover:translate-x-1 transition">입장하기 →</span>' : ''}
                    </div>
                `;

                if (isUnlocked) {
                    card.onclick = () => openDayProblems(d);
                }

                container.appendChild(card);
            }
        }

        // 일차 진입
        function openDayProblems(day) {
            selectedDay = day;
            selectedDiff = '하'; // 기본 '하'부터 열기
            showView('problem');
            renderProblemForDay();
        }

        // 난이도(하/중/상) 버튼 선택
        function selectDifficulty(diff) {
            selectedDiff = diff;
            renderProblemForDay();
        }

        function renderProblemForDay() {
            const sub = selectedDay <= 7 ? 'Java' : (selectedDay <= 12 ? 'MySQL' : 'Web');
            document.getElementById('currentDayBadge').textContent = `${selectedDay}일차 (${sub})`;

            // 난이도 버튼 UI 활성화 스타일
            const btnHa = document.getElementById('diffBtnHa');
            const btnJung = document.getElementById('diffBtnJung');
            const btnSang = document.getElementById('diffBtnSang');

            const activeStyle = 'bg-amber-500 text-slate-950 font-bold shadow';
            const inactiveStyle = 'bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium';

            btnHa.className = `px-3.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 ${selectedDiff === '하' ? activeStyle : inactiveStyle}`;
            btnJung.className = `px-3.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 ${selectedDiff === '중' ? activeStyle : inactiveStyle}`;
            btnSang.className = `px-3.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 ${selectedDiff === '상' ? activeStyle : inactiveStyle}`;

            // 해당 문제 찾기
            const prob = PROBLEMS.find(p => p.day === selectedDay && p.difficulty === selectedDiff);
            if (!prob) return;
            currentProblem = prob;

            document.getElementById('pTitle').textContent = prob.title;
            document.getElementById('pSubjectBadge').textContent = prob.subject;
            document.getElementById('pDayBadge').textContent = `${prob.day}일차`;
            document.getElementById('pDiffBadge').textContent = prob.difficulty;
            document.getElementById('pDesc').textContent = prob.desc;
            document.getElementById('pSolutionCode').textContent = prob.solution || '// 모범 답안 준비 중';

            document.getElementById('editorLang').textContent = `${prob.subject} Editor`;
            document.getElementById('codeEditor').value = prob.template;

            document.getElementById('solutionContainer').classList.add('hidden');
            document.getElementById('solChevron').classList.remove('rotate-180');
            document.getElementById('judgeBadge').classList.add('hidden');
            document.getElementById('consoleText').textContent = '// Output console';
            document.getElementById('judgeDuration').textContent = '-';
        }

        // 관리자 일차 오픈 토글
        async function toggleDayLock(day, isUnlocked) {
            if (isUnlocked) {
                if (!unlockedDays.includes(day)) unlockedDays.push(day);
            } else {
                unlockedDays = unlockedDays.filter(d => d !== day);
            }
            localStorage.setItem('unlocked_days', JSON.stringify(unlockedDays));

            try {
                await fetch(`${judgeServerUrl}/api/admin/toggle-day`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ day: day, unlocked: isUnlocked })
                });
            } catch (e) {}

            renderDaysGrid();
        }

        function toggleSolution() {
            const container = document.getElementById('solutionContainer');
            const chevron = document.getElementById('solChevron');
            container.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function resetCode() {
            if (currentProblem && confirm('기본 템플릿으로 초기화하시겠습니까?')) {
                document.getElementById('codeEditor').value = currentProblem.template;
            }
        }

        function copyCode() {
            const code = document.getElementById('codeEditor').value;
            navigator.clipboard.writeText(code).then(() => alert('코드가 복사되었습니다.'));
        }

        // 로그인 UI 업데이트
        function updateAuthUI() {
            const container = document.getElementById('authContainer');

            if (currentUser) {
                const roleBadge = currentUser.role === 'admin' 
                    ? '<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded text-[10px] font-bold">관리자</span>'
                    : '<span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded text-[10px] font-bold">학생</span>';

                container.innerHTML = `
                    <div class="flex items-center space-x-2 text-xs">
                        <span class="text-slate-300">${roleBadge} <strong>${currentUser.name}</strong></span>
                        <button onclick="handleLogout()" class="text-slate-500 hover:text-rose-400 ml-1" title="로그아웃">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="openLoginModal()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                        <i class="fa-solid fa-right-to-bracket"></i> 로그인
                    </button>
                `;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();

            try {
                const res = await fetch(`${judgeServerUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || '로그인 실패');
                    return;
                }

                const data = await res.json();
                currentUser = data.user;
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                closeLoginModal();
                updateAuthUI();
                await fetchLocks();
                renderDaysGrid();
            } catch (err) {
                if (u === 'admin' && p === 'admin1234') {
                    currentUser = { username: 'admin', name: '관리자', role: 'admin' };
                } else if (u === 'student01' && p === 'student1234') {
                    currentUser = { username: 'student01', name: '홍길동 (학생)', role: 'student' };
                } else {
                    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                    return;
                }
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                closeLoginModal();
                updateAuthUI();
                renderDaysGrid();
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('current_user');
            updateAuthUI();
            goToDaysList();
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        // 채점 및 과제 제출
        async function submitCode() {
            if (!currentUser) {
                if (confirm('로그인 후 제출하시겠습니까?')) {
                    openLoginModal();
                    return;
                }
            }

            if (!currentProblem) return;

            const code = document.getElementById('codeEditor').value;
            const submitBtn = document.getElementById('submitBtn');
            const consoleText = document.getElementById('consoleText');
            const judgeBadge = document.getElementById('judgeBadge');
            const judgeDuration = document.getElementById('judgeDuration');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 채점 중...';
            consoleText.textContent = '라즈베리 파이 샌드박스에서 격리 컴파일 및 채점 진행 중...';
            judgeBadge.className = 'hidden';
            judgeDuration.textContent = '...';

            const payload = {
                username: currentUser ? currentUser.username : 'guest',
                student_name: currentUser ? currentUser.name : '게스트',
                problem_id: currentProblem.id,
                problem_title: `[Day ${currentProblem.day}][${currentProblem.difficulty}] ${currentProblem.title}`,
                language: currentProblem.subject.toLowerCase(),
                code: code,
                expected_output: currentProblem.expected
            };

            const startTime = performance.now();

            try {
                const res = await fetch(`${judgeServerUrl}/api/judge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const elapsed = Math.round(performance.now() - startTime);
                judgeDuration.textContent = `${elapsed} ms`;

                if (!res.ok) {
                    const err = await res.json();
                    showJudgeResult('ERROR', 0, '', err.detail || '채점 서버 오류');
                    return;
                }

                const result = await res.json();
                showJudgeResult(result.status, result.score, result.stdout, result.stderr || result.message);
            } catch (err) {
                judgeDuration.textContent = '오류';
                showJudgeResult('SERVER_ERROR', 0, '', '채점 서버 연결 실패. 상단 ⚙️ 설정을 확인하세요.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-play"></i> 제출 및 채점';
            }
        }

        function showJudgeResult(status, score, stdout, stderr) {
            const badge = document.getElementById('judgeBadge');
            const text = document.getElementById('consoleText');
            badge.classList.remove('hidden');

            if (status === 'ACCEPTED') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                badge.textContent = `맞았습니다!! (${score}점)`;
            } else if (status === 'WRONG_ANSWER') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
                badge.textContent = `틀렸습니다 (${score}점)`;
            } else if (status === 'COMPILE_ERROR') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30';
                badge.textContent = '컴파일 에러';
            } else if (status === 'TIME_LIMIT_EXCEEDED') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
                badge.textContent = '시간 초과';
            } else {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
                badge.textContent = `실행 에러: ${status}`;
            }

            let logMsg = '';
            if (stdout) logMsg += `[표준 출력]\n${stdout}\n\n`;
            if (stderr) logMsg += `[상세 로그]\n${stderr}`;
            if (!logMsg) logMsg = '(출력 내용 없음)';
            text.textContent = logMsg;
        }

        // 과제 제출 현황 조회
        async function loadSubmissions() {
            const tbody = document.getElementById('submissionTableBody');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-500">제출 목록을 불러오는 중...</td></tr>';

            try {
                const res = await fetch(`${judgeServerUrl}/api/submissions`);
                if (!res.ok) throw new Error();
                const list = await res.json();

                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-500">아직 제출된 과제가 없습니다.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                list.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/40 transition';

                    let resultBadge = '';
                    if (item.status === 'ACCEPTED') {
                        resultBadge = '<span class="text-emerald-400 font-bold">맞았습니다</span>';
                    } else if (item.status === 'WRONG_ANSWER') {
                        resultBadge = '<span class="text-rose-400 font-bold">틀렸습니다</span>';
                    } else if (item.status === 'COMPILE_ERROR') {
                        resultBadge = '<span class="text-amber-400 font-bold">컴파일 에러</span>';
                    } else {
                        resultBadge = `<span class="text-rose-400 font-bold">${item.status}</span>`;
                    }

                    tr.innerHTML = `
                        <td class="px-4 py-2.5 font-mono text-slate-500">${item.id}</td>
                        <td class="px-4 py-2.5 text-white font-medium">${item.student_name} <span class="text-[10px] text-slate-500">(${item.username})</span></td>
                        <td class="px-4 py-2.5 text-slate-200">${item.problem_title}</td>
                        <td class="px-4 py-2.5">${resultBadge}</td>
                        <td class="px-4 py-2.5 font-bold ${item.score === 100 ? 'text-emerald-400' : 'text-slate-400'}">${item.score}점</td>
                        <td class="px-4 py-2.5 text-slate-400 font-mono">${item.execution_time_ms} ms</td>
                        <td class="px-4 py-2.5 text-slate-500">${item.created_at}</td>
                        <td class="px-4 py-2.5 text-center">
                            <button onclick="viewSubmittedCode(${item.id})" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-2.5 py-1 rounded text-[11px] transition">
                                코드 보기
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-rose-400">채점 서버 연결 오류</td></tr>';
            }
        }

        async function viewSubmittedCode(subId) {
            try {
                const res = await fetch(`${judgeServerUrl}/api/submissions/${subId}`);
                if (!res.ok) throw new Error();
                const data = await res.json();

                document.getElementById('modalTitle').textContent = `제출 #${data.id} - ${data.problem_title}`;
                document.getElementById('modalSubtitle').textContent = `제출자: ${data.student_name} (${data.username}) | 결과: ${data.status} (${data.score}점) | ${data.created_at}`;
                document.getElementById('modalCode').textContent = data.code;
                document.getElementById('modalOutput').textContent = data.stdout || data.stderr || '(출력 로그 없음)';
                document.getElementById('codeModal').classList.remove('hidden');
            } catch (err) {
                alert('소스코드를 불러올 수 없습니다.');
            }
        }

        function closeCodeModal() { document.getElementById('codeModal').classList.add('hidden'); }

        async function checkServerPing() {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            try {
                const res = await fetch(`${judgeServerUrl}/`, { method: 'GET', mode: 'cors' });
                if (res.ok) {
                    dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
                    txt.className = 'text-emerald-400 text-[11px]';
                    txt.textContent = 'RPi 온라인';
                } else throw new Error();
            } catch (e) {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                txt.className = 'text-rose-400 text-[11px]';
                txt.textContent = 'RPi 오프라인';
            }
        }

        function openServerModal() {
            document.getElementById('judgeServerUrlInput').value = judgeServerUrl;
            document.getElementById('serverModal').classList.remove('hidden');
        }
        function closeServerModal() { document.getElementById('serverModal').classList.add('hidden'); }

        function saveServerUrl() {
            const url = document.getElementById('judgeServerUrlInput').value.trim();
            if (url) {
                judgeServerUrl = url;
                localStorage.setItem('judge_server_url', url);
                checkServerPing();
                fetchLocks();
                closeServerModal();
            }
        }

        async function pingServer() {
            const url = document.getElementById('judgeServerUrlInput').value.trim();
            try {
                const res = await fetch(`${url}/`);
                if (res.ok) alert('서버 연결 성공!');
                else alert('응답 상태 오류: ' + res.status);
            } catch (e) {
                alert('서버 연결 실패');
            }
        }
    </script>
</body>
</html>
