<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion Judge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .code-font { font-family: 'Fira Code', 'Consolas', monospace; }
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .toggle-checkbox:checked { right: 0; border-color: #f59e0b; }
        .toggle-checkbox:checked + .toggle-label { background-color: #f59e0b; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- 상단 네비게이션 헤더 -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="showView('problem')">
                <span class="text-2xl">🦁</span>
                <span class="text-base font-bold text-white tracking-wide">Lion Judge</span>
            </div>

            <!-- 네비게이션 탭 -->
            <nav class="flex items-center space-x-1">
                <button onclick="showView('problem')" id="navProblemBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-code"></i> 문제 풀기
                </button>
                <button onclick="showView('status')" id="navStatusBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-line"></i> 제출 현황
                </button>
                <button onclick="openManageLocksModal()" id="navLockBtn" class="hidden px-3 py-1.5 rounded-lg text-xs font-bold text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lock-open"></i> 실습 공개 관리
                </button>
            </nav>
        </div>

        <!-- 우측 상태 및 계정 -->
        <div class="flex items-center space-x-3">
            <div id="serverStatusBadge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-md text-xs bg-slate-900 border border-slate-800" title="채점 서버 연결 상태">
                <span class="w-2 h-2 rounded-full bg-rose-500" id="statusDot"></span>
                <span id="statusText" class="text-slate-400 text-[11px]">오프라인</span>
            </div>

            <button onclick="openServerModal()" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-2 py-1.5 rounded-lg border border-slate-700 transition" title="서버 설정">
                <i class="fa-solid fa-gear"></i>
            </button>

            <!-- 로그인/사용자 프로필 버튼 -->
            <div id="authContainer">
                <button onclick="openLoginModal()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-to-bracket"></i> 로그인
                </button>
            </div>
        </div>
    </header>

    <!-- ======================================================== -->
    <!-- VIEW 1: 실습 문제 및 코드 채점 뷰 (기본) -->
    <!-- ======================================================== -->
    <div id="viewProblem" class="flex-1 flex flex-col overflow-hidden">
        <!-- 과목 및 일차 필터 바 -->
        <div class="bg-slate-900/80 border-b border-slate-800 px-6 py-2 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center space-x-1.5">
                <button onclick="filterSubject('all')" class="sub-btn active bg-amber-500 text-slate-950 font-semibold px-2.5 py-1 rounded transition" data-sub="all">전체</button>
                <button onclick="filterSubject('Java')" class="sub-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition" data-sub="Java">Java</button>
                <button onclick="filterSubject('MySQL')" class="sub-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition" data-sub="MySQL">MySQL</button>
                <button onclick="filterSubject('Web')" class="sub-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition" data-sub="Web">Web</button>
            </div>

            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-1.5">
                    <select id="daySelect" onchange="renderProblemList()" class="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-amber-500">
                        <option value="all">전체 일차 (1~16일차)</option>
                    </select>
                </div>

                <div class="flex items-center space-x-1">
                    <button onclick="filterDifficulty('all')" class="diff-btn active bg-slate-700 text-white px-2 py-0.5 rounded" data-diff="all">전체</button>
                    <button onclick="filterDifficulty('하')" class="diff-btn bg-emerald-950/40 text-emerald-400 border border-emerald-800/60 px-2 py-0.5 rounded" data-diff="하">하</button>
                    <button onclick="filterDifficulty('중')" class="diff-btn bg-amber-950/40 text-amber-400 border border-amber-800/60 px-2 py-0.5 rounded" data-diff="중">중</button>
                    <button onclick="filterDifficulty('상')" class="diff-btn bg-rose-950/40 text-rose-400 border border-rose-800/60 px-2 py-0.5 rounded" data-diff="상">상</button>
                </div>
            </div>
        </div>

        <!-- 2단 화면 분할: 문제 vs 에디터 -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <!-- 좌측 문제 본문 -->
            <div class="w-full md:w-1/2 flex flex-col border-r border-slate-800 bg-slate-900/40">
                <div class="bg-slate-900/90 p-2.5 border-b border-slate-800 flex items-center justify-between">
                    <div class="flex items-center space-x-2 w-full">
                        <i class="fa-solid fa-list-check text-amber-400 text-xs"></i>
                        <select id="problemSelector" onchange="selectProblem(this.value)" class="w-full bg-slate-950 border border-slate-800 text-xs font-medium rounded px-2.5 py-1.5 text-white focus:outline-none focus:border-amber-500">
                        </select>
                    </div>
                </div>

                <!-- 문제 잠금 안내 화면 (잠긴 문제인 경우 표시) -->
                <div id="lockedProblemOverlay" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center space-y-3">
                    <div class="w-14 h-14 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 text-2xl">
                        <i class="fa-solid fa-lock text-amber-500"></i>
                    </div>
                    <h3 class="text-base font-bold text-white">비공개 실습 문제입니다</h3>
                    <p class="text-xs text-slate-400 max-w-xs leading-relaxed">
                        강사/관리자가 실습 시작 시 오픈하면 자동으로 문제가 공개됩니다.
                    </p>
                    <div id="adminUnlockPrompt" class="hidden pt-2">
                        <button onclick="unlockCurrentProblemFromBanner()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition">
                            <i class="fa-solid fa-lock-open mr-1"></i> 관리자 권한으로 지금 오픈하기
                        </button>
                    </div>
                </div>

                <!-- 문제 실제 본문 화면 -->
                <div class="flex-1 overflow-y-auto p-6 space-y-4" id="problemDetailView">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span id="pSubjectBadge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">Java</span>
                            <span id="pDayBadge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">1일차</span>
                            <span id="pDiffBadge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">하</span>
                            <span id="pAdminLockBadge" class="hidden px-2 py-0.5 rounded text-[11px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                                <i class="fa-solid fa-lock-open mr-1"></i>오픈됨
                            </span>
                        </div>

                        <!-- 관리자용 원클릭 잠금 토글 -->
                        <div id="adminSingleToggle" class="hidden items-center space-x-1.5">
                            <label class="text-[11px] text-slate-400 cursor-pointer flex items-center gap-1.5">
                                <input type="checkbox" id="currentProbLockCheck" onchange="toggleCurrentProblemLock(this.checked)" class="accent-amber-500 rounded">
                                <span>학생에게 공개</span>
                            </label>
                        </div>
                    </div>

                    <h2 id="pTitle" class="text-lg font-bold text-white tracking-tight"></h2>

                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <p id="pDesc" class="text-xs text-slate-200 leading-relaxed whitespace-pre-line"></p>
                    </div>

                    <!-- 모범 정답 아코디언 -->
                    <div class="border border-slate-800 rounded-xl overflow-hidden bg-slate-900/50">
                        <button onclick="toggleSolution()" class="w-full px-4 py-2 text-left text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center justify-between transition">
                            <span class="flex items-center gap-1.5">
                                <i class="fa-solid fa-key text-amber-400"></i> 정답 예시 코드
                            </span>
                            <i id="solChevron" class="fa-solid fa-chevron-down text-slate-500 text-xs transition-transform"></i>
                        </button>
                        <div id="solutionContainer" class="hidden p-4 bg-slate-950 border-t border-slate-800">
                            <pre><code id="pSolutionCode" class="code-font text-xs text-amber-300/90 whitespace-pre-wrap select-text"></code></pre>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 우측 에디터 및 채점 콘솔 -->
            <div class="w-full md:w-1/2 flex flex-col bg-slate-950">
                <div class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between">
                    <span class="text-xs font-medium text-slate-300" id="editorLang">Editor</span>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="resetCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition">초기화</button>
                        <button onclick="copyCode()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition">복사</button>
                        <button onclick="submitCode()" id="submitBtn" class="text-xs bg-amber-500 hover:bg-amber-400 font-bold text-slate-950 px-3.5 py-1 rounded transition flex items-center gap-1">
                            <i class="fa-solid fa-play"></i> 제출 및 채점
                        </button>
                    </div>
                </div>

                <div class="flex-1 relative">
                    <textarea id="codeEditor" spellcheck="false" class="w-full h-full p-4 bg-slate-950 text-slate-100 code-font text-xs leading-relaxed resize-none focus:outline-none placeholder-slate-700 select-text"></textarea>
                </div>

                <!-- 채점 콘솔 창 -->
                <div class="border-t border-slate-800 bg-slate-900/90 flex flex-col h-52">
                    <div class="px-4 py-1.5 border-b border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-terminal"></i> 실행 결과
                        </span>
                        <span id="judgeDuration">-</span>
                    </div>
                    <div class="p-3.5 flex-1 overflow-y-auto space-y-1.5" id="consoleOutput">
                        <div id="judgeBadge" class="hidden inline-block px-2.5 py-0.5 rounded text-[11px] font-bold"></div>
                        <pre id="consoleText" class="code-font text-xs text-slate-400 whitespace-pre-wrap select-text">// Output console</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- VIEW 2: 백준 스타일 실시간 제출 현황 (Status View) -->
    <!-- ======================================================== -->
    <div id="viewStatus" class="hidden flex-1 overflow-y-auto p-6 max-w-6xl mx-auto w-full space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-list-ol text-amber-400"></i> 과제 제출 현황
            </h2>
            <button onclick="loadSubmissions()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate"></i> 새로고침
            </button>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-900 text-slate-400 uppercase font-semibold border-b border-slate-800">
                    <tr>
                        <th class="px-4 py-2.5">제출#</th>
                        <th class="px-4 py-2.5">학생</th>
                        <th class="px-4 py-2.5">문제</th>
                        <th class="px-4 py-2.5">결과</th>
                        <th class="px-4 py-2.5">점수</th>
                        <th class="px-4 py-2.5">시간</th>
                        <th class="px-4 py-2.5">제출일시</th>
                        <th class="px-4 py-2.5 text-center">코드</th>
                    </tr>
                </thead>
                <tbody id="submissionTableBody" class="divide-y divide-slate-800/80 font-medium">
                </tbody>
            </table>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- 관리자 전용: 실습 문제 일차별 공개(Unlock) 관리 모달 -->
    <!-- ======================================================== -->
    <div id="manageLocksModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-slate-850 bg-slate-800/90 px-6 py-3.5 border-b border-slate-800 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-user-shield text-amber-400"></i> 실습 문제 공개 관리
                    </h3>
                    <p class="text-[11px] text-slate-400">체크한 일차/문제만 학생들에게 노출되어 풀 수 있습니다.</p>
                </div>
                <button onclick="closeManageLocksModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto space-y-3" id="locksListContainer">
                <!-- 동적 렌더링: 1~16일차 카드 -->
            </div>

            <div class="bg-slate-950 px-6 py-3 border-t border-slate-800 flex items-center justify-between text-xs">
                <span class="text-slate-400" id="unlockedCountText">오픈된 일차: 1일차</span>
                <button onclick="closeManageLocksModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-1.5 rounded-lg transition">확인 완료</button>
            </div>
        </div>
    </div>

    <!-- 소스코드 확인 팝업 모달 -->
    <div id="codeModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-slate-800 px-6 py-3.5 border-b border-slate-700 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-bold text-white" id="modalTitle">제출 소스코드</h3>
                    <p class="text-[11px] text-slate-400" id="modalSubtitle"></p>
                </div>
                <button onclick="closeCodeModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <div class="p-6 flex-1 overflow-y-auto space-y-4">
                <pre class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-amber-200 code-font text-xs overflow-x-auto select-text"><code id="modalCode"></code></pre>
                <div id="modalOutputSection">
                    <span class="text-[11px] text-slate-400 block mb-1">실행 출력:</span>
                    <pre class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-slate-300 code-font text-xs overflow-x-auto select-text"><code id="modalOutput"></code></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xs p-6 shadow-2xl space-y-4">
            <div class="text-center">
                <span class="text-2xl">🦁</span>
                <h3 class="text-base font-bold text-white mt-1">로그인</h3>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">아이디</label>
                    <input type="text" id="loginUsername" required placeholder="admin 또는 student01" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">비밀번호</label>
                    <input type="password" id="loginPassword" required placeholder="비밀번호" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button type="button" onclick="closeLoginModal()" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg">취소</button>
                    <button type="submit" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-1.5 rounded-lg">로그인</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 서버 설정 모달 -->
    <div id="serverModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-server text-amber-400"></i> 채점 서버 설정
            </h3>
            <div>
                <input type="text" id="judgeServerUrlInput" value="http://100.104.124.97:8000" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex items-center justify-between pt-2">
                <button onclick="pingServer()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">연결 테스트</button>
                <div class="space-x-1.5">
                    <button onclick="closeServerModal()" class="text-xs bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg">취소</button>
                    <button onclick="saveServerUrl()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-1.5 rounded-lg">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 문제 데이터셋 -->
    <script src="problems.js"></script>

    <script>
        let currentSubject = 'all';
        let currentDay = 'all';
        let currentDiff = 'all';
        let currentProblem = null;
        let judgeServerUrl = localStorage.getItem('judge_server_url') || 'http://100.104.124.97:8000';
        let currentUser = JSON.parse(localStorage.getItem('current_user') || 'null');

        // 오픈(Unlock) 상태 관리 (기본 1일차 오픈)
        let unlockedDays = JSON.parse(localStorage.getItem('unlocked_days') || '[1]');
        let unlockedProblems = JSON.parse(localStorage.getItem('unlocked_problems') || '[]');

        window.addEventListener('DOMContentLoaded', async () => {
            initDaySelect();
            updateAuthUI();
            checkServerPing();
            await fetchLocks();
            renderProblemList();
        });

        // 서버에서 최신 오픈 상태 가져오기
        async function fetchLocks() {
            try {
                const res = await fetch(`${judgeServerUrl}/api/locks`);
                if (res.ok) {
                    const data = await res.json();
                    unlockedDays = data.unlocked_days || [1];
                    unlockedProblems = data.unlocked_problems || [];
                    localStorage.setItem('unlocked_days', JSON.stringify(unlockedDays));
                    localStorage.setItem('unlocked_problems', JSON.stringify(unlockedProblems));
                }
            } catch (e) {
                // 오프라인 fallback
            }
        }

        function isProblemUnlocked(p) {
            // 관리자는 항상 모든 문제 열람 가능
            if (currentUser && currentUser.role === 'admin') return true;
            // 일차 전체가 열려있거나 개별 문제가 열려있는 경우
            if (unlockedDays.includes(p.day)) return true;
            if (unlockedProblems.includes(p.id)) return true;
            return false;
        }

        function showView(viewName) {
            const viewProb = document.getElementById('viewProblem');
            const viewStat = document.getElementById('viewStatus');
            const navProb = document.getElementById('navProblemBtn');
            const navStat = document.getElementById('navStatusBtn');

            if (viewName === 'problem') {
                viewProb.classList.remove('hidden');

        // 로그인 UI 업데이트
        function updateAuthUI() {
            const container = document.getElementById('authContainer');
            const navLockBtn = document.getElementById('navLockBtn');
            const adminSingleToggle = document.getElementById('adminSingleToggle');

            if (currentUser) {
                const roleBadge = currentUser.role === 'admin' 
                    ? '<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded text-[10px] font-bold">관리자</span>'
                    : '<span class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded text-[10px] font-bold">학생</span>';

                container.innerHTML = `
                    <div class="flex items-center space-x-2 text-xs">
                        <span class="text-slate-300">${roleBadge} <strong>${currentUser.name}</strong></span>
                        <button onclick="handleLogout()" class="text-slate-500 hover:text-rose-400 ml-1" title="로그아웃">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>
                `;

                if (currentUser.role === 'admin') {
                    navLockBtn.classList.remove('hidden');
                    if (adminSingleToggle) adminSingleToggle.classList.remove('hidden');
                } else {
                    navLockBtn.classList.add('hidden');
                    if (adminSingleToggle) adminSingleToggle.classList.add('hidden');
                }
            } else {
                container.innerHTML = `
                    <button onclick="openLoginModal()" class="text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                        <i class="fa-solid fa-right-to-bracket"></i> 로그인
                    </button>
                `;
                navLockBtn.classList.add('hidden');
                if (adminSingleToggle) adminSingleToggle.classList.add('hidden');
            }
        }

        // 로그인 처리
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();

            try {
                const res = await fetch(`${judgeServerUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || '로그인 실패');
                    return;
                }

                const data = await res.json();
                currentUser = data.user;
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                closeLoginModal();
                updateAuthUI();
                await fetchLocks();
                renderProblemList();
            } catch (err) {
                if (u === 'admin' && p === 'admin1234') {
                    currentUser = { username: 'admin', name: '관리자', role: 'admin' };
                } else if (u === 'student01' && p === 'student1234') {
                    currentUser = { username: 'student01', name: '홍길동 (학생)', role: 'student' };
                } else {
                    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                    return;
                }
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                closeLoginModal();
                updateAuthUI();
                renderProblemList();
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('current_user');
            updateAuthUI();
            renderProblemList();
            showView('problem');
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        // 일차 초기화
        function initDaySelect() {
            const select = document.getElementById('daySelect');
            for (let i = 1; i <= 16; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                const sub = i <= 7 ? 'Java' : (i <= 12 ? 'MySQL' : 'Web');
                opt.textContent = `${i}일차 (${sub})`;
                select.appendChild(opt);
            }
        }

        function filterSubject(sub) {
            currentSubject = sub;
            document.querySelectorAll('.sub-btn').forEach(b => {
                b.className = b.dataset.sub === sub 
                    ? 'sub-btn active bg-amber-500 text-slate-950 font-semibold px-2.5 py-1 rounded transition'
                    : 'sub-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded transition';
            });
            renderProblemList();
        }

        function filterDifficulty(diff) {
            currentDiff = diff;
            document.querySelectorAll('.diff-btn').forEach(b => {
                const isSelected = b.dataset.diff === diff;
                if (isSelected) {
                    b.className = 'diff-btn active bg-slate-700 text-white px-2 py-0.5 rounded';
                } else {
                    const d = b.dataset.diff;
                    if (d === '하') b.className = 'diff-btn bg-emerald-950/40 text-emerald-400 border border-emerald-800/60 px-2 py-0.5 rounded';
                    else if (d === '중') b.className = 'diff-btn bg-amber-950/40 text-amber-400 border border-amber-800/60 px-2 py-0.5 rounded';
                    else if (d === '상') b.className = 'diff-btn bg-rose-950/40 text-rose-400 border border-rose-800/60 px-2 py-0.5 rounded';
                    else b.className = 'diff-btn bg-slate-800 text-slate-400 px-2 py-0.5 rounded';
                }
            });
            renderProblemList();
        }

        function renderProblemList() {
            currentDay = document.getElementById('daySelect').value;
            const selector = document.getElementById('problemSelector');
            selector.innerHTML = '';

            const filtered = PROBLEMS.filter(p => {
                if (currentSubject !== 'all' && p.subject !== currentSubject) return false;
                if (currentDay !== 'all' && p.day !== parseInt(currentDay)) return false;
                if (currentDiff !== 'all' && p.difficulty !== currentDiff) return false;
                return true;
            });

            if (filtered.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = '조건에 맞는 문제가 없습니다.';
                selector.appendChild(opt);
                return;
            }

            filtered.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                const isUnlocked = isProblemUnlocked(p);
                const lockPrefix = isUnlocked ? '' : '🔒 [비공개] ';
                opt.textContent = `${lockPrefix}[${p.day}일차][${p.difficulty}] ${p.title}`;
                selector.appendChild(opt);
            });

            selectProblem(filtered[0].id);
        }

        function selectProblem(probId) {
            const p = PROBLEMS.find(item => item.id === probId);
            if (!p) return;
            currentProblem = p;

            const isUnlocked = isProblemUnlocked(p);
            const overlay = document.getElementById('lockedProblemOverlay');
            const detailView = document.getElementById('problemDetailView');
            const adminUnlockPrompt = document.getElementById('adminUnlockPrompt');
            const currentProbLockCheck = document.getElementById('currentProbLockCheck');
            const codeEditor = document.getElementById('codeEditor');
            const submitBtn = document.getElementById('submitBtn');

            // 관리자인 경우 현재 문제 오픈 체크박스 동기화
            if (currentUser && currentUser.role === 'admin') {
                const probOpened = unlockedDays.includes(p.day) || unlockedProblems.includes(p.id);
                currentProbLockCheck.checked = probOpened;
            }

            if (!isUnlocked) {
                // 비공개 상태 (학생에게 잠김)
                overlay.classList.remove('hidden');
                detailView.classList.add('hidden');
                codeEditor.value = '// 비공개 실습 문제입니다. 관리자가 오픈하면 활성화됩니다.';
                codeEditor.disabled = true;
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-40', 'cursor-not-allowed');

                if (currentUser && currentUser.role === 'admin') {
                    adminUnlockPrompt.classList.remove('hidden');
                } else {
                    adminUnlockPrompt.classList.add('hidden');
                }
                return;
            }

            // 공개 상태 (정상 노출)
            overlay.classList.add('hidden');
            detailView.classList.remove('hidden');
            codeEditor.disabled = false;
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');

            document.getElementById('pTitle').textContent = p.title;
            document.getElementById('pSubjectBadge').textContent = p.subject;
            document.getElementById('pDayBadge').textContent = `${p.day}일차`;
            document.getElementById('pDiffBadge').textContent = p.difficulty;
            document.getElementById('pDesc').textContent = p.desc;
            document.getElementById('pSolutionCode').textContent = p.solution || '// 모범 답안 준비 중';

            document.getElementById('editorLang').textContent = `${p.subject} Editor`;
            codeEditor.value = p.template;

            document.getElementById('solutionContainer').classList.add('hidden');
            document.getElementById('solChevron').classList.remove('rotate-180');
            document.getElementById('judgeBadge').classList.add('hidden');
            document.getElementById('consoleText').textContent = '// Output console';
            document.getElementById('judgeDuration').textContent = '-';
        }

        // 관리자 전용: 현재 보고 있는 문제 즉시 오픈/잠금 토글
        async function toggleCurrentProblemLock(checked) {
            if (!currentProblem) return;
            await updateProblemLock(currentProblem.id, checked);
            renderProblemList();
        }

        async function unlockCurrentProblemFromBanner() {
            if (!currentProblem) return;
            await updateProblemLock(currentProblem.id, true);
            renderProblemList();
        }

        // 관리자 실습 공개 관리 모달
        function openManageLocksModal() {
            renderLocksManager();
            document.getElementById('manageLocksModal').classList.remove('hidden');
        }

        function closeManageLocksModal() {
            document.getElementById('manageLocksModal').classList.add('hidden');
            renderProblemList();
        }

        function renderLocksManager() {
            const container = document.getElementById('locksListContainer');
            container.innerHTML = '';

            let unlockedCount = 0;

            for (let d = 1; d <= 16; d++) {
                const sub = d <= 7 ? 'Java' : (d <= 12 ? 'MySQL' : 'Web');
                const isDayUnlocked = unlockedDays.includes(d);
                if (isDayUnlocked) unlockedCount++;

                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border transition flex items-center justify-between ${
                    isDayUnlocked ? 'bg-amber-500/10 border-amber-500/40' : 'bg-slate-950 border-slate-800'
                }`;

                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${
                            isDayUnlocked ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                        }">
                            ${d}
                        </span>
                        <div>
                            <span class="text-xs font-bold text-white">${d}일차 (${sub})</span>
                            <span class="text-[11px] ml-2 ${isDayUnlocked ? 'text-amber-400' : 'text-slate-500'}">
                                ${isDayUnlocked ? '🔓 전체 공개 중' : '🔒 비공개'}
                            </span>
                        </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" onchange="toggleDayLock(${d}, this.checked)" class="sr-only peer" ${isDayUnlocked ? 'checked' : ''}>
                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
                    </label>
                `;
                container.appendChild(card);
            }

            document.getElementById('unlockedCountText').textContent = `오픈된 일차: 총 ${unlockedCount} / 16개`;
        }

        async function toggleDayLock(day, isUnlocked) {
            if (isUnlocked) {
                if (!unlockedDays.includes(day)) unlockedDays.push(day);
            } else {
                unlockedDays = unlockedDays.filter(d => d !== day);
            }
            localStorage.setItem('unlocked_days', JSON.stringify(unlockedDays));

            // 서버에 동기화 요청
            try {
                await fetch(`${judgeServerUrl}/api/admin/toggle-day`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ day: day, unlocked: isUnlocked })
                });
            } catch (e) {}

            renderLocksManager();
        }

        async function updateProblemLock(problemId, isUnlocked) {
            if (isUnlocked) {
                if (!unlockedProblems.includes(problemId)) unlockedProblems.push(problemId);
            } else {
                unlockedProblems = unlockedProblems.filter(pid => pid !== problemId);
            }
            localStorage.setItem('unlocked_problems', JSON.stringify(unlockedProblems));

            try {
                await fetch(`${judgeServerUrl}/api/admin/toggle-problem`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ problem_id: problemId, unlocked: isUnlocked })
                });
            } catch (e) {}
        }

        function toggleSolution() {
            const container = document.getElementById('solutionContainer');
            const chevron = document.getElementById('solChevron');
            container.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function resetCode() {
            if (currentProblem && confirm('기본 템플릿으로 초기화하시겠습니까?')) {
                document.getElementById('codeEditor').value = currentProblem.template;
            }
        }

        function copyCode() {
            const code = document.getElementById('codeEditor').value;
            navigator.clipboard.writeText(code).then(() => alert('코드가 복사되었습니다.'));
        }

        // 채점 및 과제 제출
        async function submitCode() {
            if (!currentUser) {
                if (confirm('로그인 후 제출하시겠습니까?')) {
                    openLoginModal();
                    return;
                }
            }

            if (!currentProblem) return;

            const code = document.getElementById('codeEditor').value;
            const submitBtn = document.getElementById('submitBtn');
            const consoleText = document.getElementById('consoleText');
            const judgeBadge = document.getElementById('judgeBadge');
            const judgeDuration = document.getElementById('judgeDuration');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 채점 중...';
            consoleText.textContent = '라즈베리 파이 샌드박스에서 격리 컴파일 및 채점 진행 중...';
            judgeBadge.className = 'hidden';
            judgeDuration.textContent = '...';

            const payload = {
                username: currentUser ? currentUser.username : 'guest',
                student_name: currentUser ? currentUser.name : '게스트',
                problem_id: currentProblem.id,
                problem_title: `[Day ${currentProblem.day}] ${currentProblem.title}`,
                language: currentProblem.subject.toLowerCase(),
                code: code,
                expected_output: currentProblem.expected
            };

            const startTime = performance.now();

            try {
                const res = await fetch(`${judgeServerUrl}/api/judge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const elapsed = Math.round(performance.now() - startTime);
                judgeDuration.textContent = `${elapsed} ms`;

                if (!res.ok) {
                    const err = await res.json();
                    showJudgeResult('ERROR', 0, '', err.detail || '채점 서버 오류');
                    return;
                }

                const result = await res.json();
                showJudgeResult(result.status, result.score, result.stdout, result.stderr || result.message);
            } catch (err) {
                judgeDuration.textContent = '오류';
                showJudgeResult('SERVER_ERROR', 0, '', '채점 서버(라즈베리파이) 연결에 실패했습니다. 상단 ⚙️ 설정을 확인하세요.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-play"></i> 제출 및 채점';
            }
        }

        function showJudgeResult(status, score, stdout, stderr) {
            const badge = document.getElementById('judgeBadge');
            const text = document.getElementById('consoleText');
            badge.classList.remove('hidden');

            if (status === 'ACCEPTED') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                badge.textContent = `맞았습니다!! (${score}점)`;
            } else if (status === 'WRONG_ANSWER') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
                badge.textContent = `틀렸습니다 (${score}점)`;
            } else if (status === 'COMPILE_ERROR') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30';
                badge.textContent = '컴파일 에러';
            } else if (status === 'TIME_LIMIT_EXCEEDED') {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
                badge.textContent = '시간 초과';
            } else {
                badge.className = 'inline-block px-2.5 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30';
                badge.textContent = `실행 에러: ${status}`;
            }

            let logMsg = '';
            if (stdout) logMsg += `[표준 출력]\n${stdout}\n\n`;
            if (stderr) logMsg += `[상세 로그]\n${stderr}`;
            if (!logMsg) logMsg = '(출력 내용 없음)';
            text.textContent = logMsg;
        }

        // 제출 이력 조회
        async function loadSubmissions() {
            const tbody = document.getElementById('submissionTableBody');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-500">제출 목록을 불러오는 중...</td></tr>';

            try {
                const res = await fetch(`${judgeServerUrl}/api/submissions`);
                if (!res.ok) throw new Error();
                const list = await res.json();

                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-500">아직 제출된 과제가 없습니다.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                list.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/40 transition';

                    let resultBadge = '';
                    if (item.status === 'ACCEPTED') {
                        resultBadge = '<span class="text-emerald-400 font-bold">맞았습니다</span>';
                    } else if (item.status === 'WRONG_ANSWER') {
                        resultBadge = '<span class="text-rose-400 font-bold">틀렸습니다</span>';
                    } else if (item.status === 'COMPILE_ERROR') {
                        resultBadge = '<span class="text-amber-400 font-bold">컴파일 에러</span>';
                    } else {
                        resultBadge = `<span class="text-rose-400 font-bold">${item.status}</span>`;
                    }

                    tr.innerHTML = `
                        <td class="px-4 py-2.5 font-mono text-slate-500">${item.id}</td>
                        <td class="px-4 py-2.5 text-white font-medium">${item.student_name} <span class="text-[10px] text-slate-500">(${item.username})</span></td>
                        <td class="px-4 py-2.5 text-slate-200">${item.problem_title}</td>
                        <td class="px-4 py-2.5">${resultBadge}</td>
                        <td class="px-4 py-2.5 font-bold ${item.score === 100 ? 'text-emerald-400' : 'text-slate-400'}">${item.score}점</td>
                        <td class="px-4 py-2.5 text-slate-400 font-mono">${item.execution_time_ms} ms</td>
                        <td class="px-4 py-2.5 text-slate-500">${item.created_at}</td>
                        <td class="px-4 py-2.5 text-center">
                            <button onclick="viewSubmittedCode(${item.id})" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-2.5 py-1 rounded text-[11px] transition">
                                코드 보기
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-rose-400">채점 서버 연결 오류</td></tr>';
            }
        }

        async function pingServer() {
            const url = document.getElementById('judgeServerUrlInput').value.trim();
            try {
                const res = await fetch(`${url}/`);
                if (res.ok) alert('서버 연결 성공!');
                else alert('응답 상태 오류: ' + res.status);
            } catch (e) {
                alert('서버 연결 실패');
            }
        }
    </script>
